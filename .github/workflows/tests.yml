name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q app.py exam_versions.py question_importer.py source_formats.py

      - name: Run focused correctness lint
        run: python -m ruff check .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit declared dependencies
        run: python -m pip_audit -r requirements.txt

  tests:
    name: Regression and compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install document converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m unittest discover -v -p 'test_*.py'
